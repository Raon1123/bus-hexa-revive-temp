; docker/supervisord.conf — 단일 컨테이너에서 web + 2 worker를 함께 구동.
;
; 배경: 과거엔 compose가 web/worker-govtrack/worker-arrival를 별도 서비스로 분리했다
; (ADR-010 Q3, "독립 오류 도메인"). 운영 단순화를 위해 한 컨테이너로 통합하되, 오류 격리는
; program별 autorestart=true 로 보존한다(한 프로세스가 죽어도 나머지는 영향 없음).
;
; 데이터: 세 프로세스 모두 같은 SQLite 파일(/app/data/bushexa.db, bind-mount)을 공유한다.
; web=reader, worker 2개=writer. connection.py의 PRAGMA busy_timeout이 동시 쓰기 충돌을 흡수.
;
; 로그: 각 program의 stdout/stderr를 컨테이너 stdout(/dev/stdout)으로 흘려 `podman logs`로 수집.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

; supervisorctl이 program 상태를 조회할 수 있게 로컬 unix 소켓을 연다(운영 디버깅용).
;   docker compose exec app supervisorctl status
[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:web]
command=python -m bushexa serve --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker-govtrack]
command=python -m bushexa crawl-loop
directory=/app
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker-arrival]
command=python -m bushexa arrival-loop
directory=/app
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; 저빈도 데이터(공휴일·시간표) 유휴시간 갱신. 외부 API는 이 워커에서만 호출하고,
; web(board/lite/busno/...)은 영속 캐시(holiday_cache.json/timetable)만 읽는다.
; 부팅 시 공휴일 1회 갱신 후, 매일 새벽 02–03시에 공휴일+시간표 재크롤.
[program:worker-cache-refresh]
command=python -m bushexa cache-refresh-loop
directory=/app
autostart=true
autorestart=true
startretries=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
