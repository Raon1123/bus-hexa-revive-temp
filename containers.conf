# containers.conf — 이 프로젝트 전용 podman 설정 override.
# 전역(~/.config/containers/containers.conf)을 건드리지 않고,
# 실행 시 CONTAINERS_CONF_OVERRIDE 로만 끼워넣어 keyring 생성을 끈다.
#
# 사용:
#   CONTAINERS_CONF_OVERRIDE=$PWD/containers.conf \
#     podman-compose -f compose.podman.yaml up -d
#
# 이유: rootless podman 이 컨테이너 세션 keyring 을 만들다 per-user 키 한도(EDQUOT,
#       "Disk quota exceeded")에 막힘. 이 앱은 커널 keyring 을 쓰지 않으므로 꺼도 무해.

[containers]
keyring = false
