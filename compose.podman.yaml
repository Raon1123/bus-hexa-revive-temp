# compose.podman.yaml — 프로젝트 루트에서 실행하는 단일 컨테이너 스택 (canonical)
#
# 변경(이전: web/worker-govtrack/worker-arrival/postgres 4서비스):
#   - web + 2 worker를 단일 `app` 서비스로 통합 → supervisord가 한 컨테이너에서 모두 구동
#     (docker/supervisord.conf). 오류 격리는 program별 autorestart로 보존.
#   - postgres 제거 → SQLite 단일 백엔드(.env의 DATABASE_URL=sqlite:///./data/bushexa.db).
#     도착 cache는 arrival-loop이 매 N초 ./data/bushexa.db에 재생성하므로 별도 DB 불필요.
#
# 사용법 (반드시 프로젝트 루트에서):
#   CONTAINERS_CONF_OVERRIDE=$PWD/containers.conf podman-compose -f compose.podman.yaml build
#   CONTAINERS_CONF_OVERRIDE=$PWD/containers.conf podman-compose -f compose.podman.yaml up -d
#   podman-compose -f compose.podman.yaml logs -f app   # web/worker-govtrack/worker-arrival 통합 로그
#
# 포트: 8017(host) -> 8000(container, bushexa serve 기본값).

services:

  app:
    image: bushexa:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    # web + 2 worker를 supervisord가 한 컨테이너에서 구동 (Dockerfile ENTRYPOINT override).
    entrypoint: ["supervisord", "-n", "-c", "/app/docker/supervisord.conf"]
    env_file: ./.env
    ports:
      - "8017:8000"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/lite >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./bushexa:/app/bushexa:ro   # 소스(bind-mount 모델 — 이미지엔 .venv·supervisord.conf만)
      - ./data:/app/data            # SQLite DB + 시간표/공휴일/비밀번호 해시 (rw)
      - ./secret:/app/secret:ro     # API 키 등 읽기전용 시크릿 (비밀번호는 data/로 이전됨)
      - ./logs:/app/logs

networks:
  default:
    name: bushexa
