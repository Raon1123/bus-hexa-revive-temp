{#
  board_lite.html — FASTER 모드. 阿部寛(Abe Hiroshi) 홈페이지급 즉시 렌더가 목표.
  디자인은 사치: <style> 0, 외부 자산 0, JS 0, 웹폰트 0. 순수 HTML 표 + <meta refresh>만.
  데이터는 bus_arrival_cache(arrival poller 백업본)에서 읽으므로 라이브 API 호출 없음(ADR-010).
#}
<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="{{ refresh_seconds }}">
<title>출발 게시판 (Lite)</title>
</head>
<body>
<p>출발 게시판 · {{ snapshot.weekday_str }} · 현재 {{ snapshot.current_time }}
· {{ refresh_seconds }}초 자동갱신{% if fetched_at %} · 데이터 {{ fetched_at }}{% endif %}</p>

{% for n in notices %}<p>[{{ t('notice.kind.' ~ n.kind) }}] {{ n.text }}{% if n.link and n.link in notice_link_endpoints %} <a href="{{ url_for(notice_link_endpoints[n.link]) }}">{{ t('notice.more') }}</a>{% endif %}</p>
{% endfor %}
{% if snapshot.error %}<p>⚠ {{ snapshot.error }}</p>{% endif %}

<table border="1" cellpadding="4" cellspacing="0">
<tr><th>시각</th><th>노선</th><th>행선</th><th>현재 위치</th></tr>
{% if snapshot.rows %}
{% for row in snapshot.rows %}
<tr>
<td>{% if row.rank == 'FIRST' %}* {% elif row.rank == 'SECOND' %}+ {% endif %}{{ row.arrival_time }}</td>
<td>{{ row.bus_number }}</td>
<td>{{ row.terminal or '-' }}{% if row.via_string %} ({{ row.via_string }}){% endif %}</td>
<td>{{ row.present }}</td>
</tr>
{% endfor %}
{% elif snapshot.is_last_bus %}
<tr><td colspan="4">금일 운행 종료 · NO MORE BUSES TODAY</td></tr>
{% else %}
<tr><td colspan="4">출발 정보 없음 · NO DEPARTURES</td></tr>
{% endif %}
</table>

<p><a href="{{ url_for('board.departure_board') }}">일반 게시판</a></p>
</body>
</html>
